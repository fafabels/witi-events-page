<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WITI Bulletin Board</title>
    <noscript>
        <meta http-equiv="refresh" content="0; url=./static/user/bulletin.html">
    </noscript>
    <style>
        body {
            background: rgb(54, 54, 65);
        }
        #gate {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            text-align: center;
            background: rgb(119, 119, 165);
            width: 50%;
            border-radius: 40px;
            box-shadow: 0px 0px 20px 5px rgb(0, 0, 0);
        }
        button {
            height: 40px;
            width: 20%;
            justify-self: center;
            align-self: center;
            border-radius: 10px;
            background: rgb(236, 251, 255);
            border: 1px solid rgb(0, 0, 0);
            cursor: pointer;
        }
        button:hover {
            background: rgb(255, 255, 255);
        }
        button:active {
            background: rgb(200, 200, 200);
        }
        h1 {
            color: white;
            width: 80%;
            justify-self: center;
            align-self: center;
        }
        a {
            color: rgb(72, 72, 72);
            margin: 20px;
            opacity: 0.5;
            cursor: pointer;
        }
        a:hover {
            opacity: 1;
        }
        #admin_status {
            min-height: 18px;
            margin: 0 0 10px;
            font-size: 13px;
            color: white;
        }
    </style>
</head>
<body>
    <div id="gate">
        <h1>Click the button to enter the bulletin board</h1>
        <button onclick="window.location.href='./static/user/main.html'">Open</button>
        <p id="admin_status"></p>
        <a id="admin_link">You're an admin? click here to log in</a>
    </div>

    <script>
        // ============================================================
        //  index.html -- static entry point.
        //
        //  "You're an admin?" asks the server who you are:
        //    * a valid admin session cookie  -> straight to admin.html
        //    * no session / no admins yet    -> the login page
        //  The admin name/password pairs live in the admin_credentials
        //  table of the D1 database, checked by /api/admin/login, so
        //  nothing secret is ever held on this page.
        // ============================================================

        const adminLink = document.getElementById("admin_link");
        const adminStatus = document.getElementById("admin_status");
        let adminTarget = "./static/admin/login.html";

        async function checkAdminSession() {
            try {
                const res = await fetch("/api/admin/session", {
                    credentials: "same-origin",
                    headers: { Accept: "application/json" },
                });
                if (!res.ok) return;
                const data = await res.json();
                if (!data.authenticated) return;

                // Already signed in -- say so, and offer the admin page.
                adminTarget = "./static/admin/admin.html";
                adminLink.textContent = `You're an admin? ${data.name} is logged in \u2014 open the admin page`;
                adminStatus.textContent = `Signed in as ${data.name}.`;
            } catch {
                // No functions locally (e.g. opening the file directly);
                // the login page still shows and explains itself.
            }
        }

        // The prompt: confirm first, then route by session.
        adminLink.addEventListener("click", async () => {
            const confirmed = window.confirm("Are you an admin?");
            if (!confirmed) return;
            adminLink.style.pointerEvents = "none";
            await checkAdminSession();
            window.location.href = adminTarget;
        });

        checkAdminSession();
    </script>
</body>
</html>
