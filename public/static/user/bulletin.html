<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WITI Bulletin</title>
        <link rel="stylesheet" href="../../styles/bulletin_styles.css">
    </head>
    <body>
        <header>
            <h1 class="main-title">WITI Bulletin Board</h1>
            <nav id="navigation">
                <ul>
                    <a class="nav_button" href="./main.html">Home</a>
                    <a class="nav_button" href="./bulletin.html">Bulletin</a>
                    <a class="nav_button" href="./account.html">Account</a>
                    <a class="nav_button" href="./settings.html">Settings</a>
                </ul>
            </nav>
        </header>
        <main>
            <section class="gap">
                <p>a</p>
            </section>

            <section id="announcement">
                <article class="" id="school_announcement">
                    <h2>Announcements</h2>
                    <div id="a_con">
                        <div class="margin_con" id="a_list">
                            <p class="empty_note">No announcements</p>
                        </div>
                    </div>
                </article>
            </section>
            <section class="gap">
                <p>a</p>
            </section>
            <section id="events">
                <article class="events_con">
                    <div class="margin_con">
                        <h2>School Events</h2>
                        <div id="se_ann_con">
                            <p class="empty_note">No events</p>
                        </div>
                    </div>
                    
                </article>
                <article class="events_con">
                    <div class="margin_con">
                        <h2>Club Events</h2>
                        <div id="ce_ann_con">
                            <p class="empty_note">No events</p>
                        </div>
                    </div>
                    
                </article>
            </section>
            <section class="gap">
                <p>a</p>
            </section>
            <section>
                <footer>
                    <p>Copyright &copy; 2026 WITI Bulletin Board</p>
                    <!--
                    <div class="footer-header">
                    </div>
                    -->
                    
                    <div class="footer-redirections">
                        <div class="footer-links">
                            <p>Contacts:</p>
                            <a href="https://web.facebook.com/profile.php?id=61568071182115" target="_blank">Follow us on Facebook</a>
                        </div>
                        <div class="footer-sections">
                            <p>Sections:</p>
                            <a href="#about">About</a>
                            <a href="#get-started">Get Started</a>
                        </div>
                    </div>
                    
                </footer>
            </section>
        </main>
        <script>
            // ============================================================
            //  bulletin.html -- renders the board from /api/bulletin.
            //
            //  GET /api/bulletin returns:
            //    { announcements: [{ id, message, detail }],
            //      events:        [{ id, kind, message, date }] }
            //
            //  a_con    <- announcements. The short message is shown;
            //              clicking it (or hovering) reveals `detail`
            //              directly below the message.
            //  se_con   <- events with kind === "school"
            //  ce_con   <- events with kind === "club"
            //              Each event shows its message and its date
            //              formatted as "July 20, 2020".
            //
            //  Everything is built with textContent, never innerHTML, so
            //  an admin-entered message like "<script>" renders as text.
            // ============================================================

            const aList = document.getElementById("a_list");
            const seList = document.getElementById("se_ann_con");
            const ceList = document.getElementById("ce_ann_con");

            // "July 20, 2020" from "2020-07-20". Parsed as UTC so the
            // day never shifts by one in a negative timezone.
            function formatEventDate(isoDate) {
                const [y, m, d] = String(isoDate).split("-").map(Number);
                const date = new Date(Date.UTC(y, m - 1, d));
                return date.toLocaleDateString("en-US", {
                    month: "long",
                    day: "numeric",
                    year: "numeric",
                    timeZone: "UTC",
                });
            }

            function showEmpty(container, text) {
                container.replaceChildren();
                const note = document.createElement("p");
                note.className = "empty_note";
                note.textContent = text;
                container.append(note);
            }

            // --- a_con: announcement + click/hover detail -----------
            //  Same row shape as an event: message on the left, and the
            //  detail sits directly BELOW the message. The detail is
            //  hidden until the row is hovered, focused, or clicked.
            function renderAnnouncements(announcements) {
                if (!announcements || announcements.length === 0) {
                    showEmpty(aList, "No announcements");
                    return;
                }

                aList.replaceChildren();

                for (const item of announcements) {
                    const row = document.createElement("div");
                    row.className = "announcement";

                    const text = document.createElement("div");
                    text.className = "announcement_text";

                    const message = document.createElement("p");
                    message.className = "announcement_message";
                    message.textContent = item.message;
                    text.append(message);

                    // Only announcements that actually have details get
                    // the click/hover behaviour and the arrow hint.
                    if (item.detail) {
                        row.classList.add("has_detail");
                        row.tabIndex = 0; // keyboard reachable
                        row.setAttribute("role", "button");
                        row.setAttribute("aria-expanded", "false");

                        const detail = document.createElement("p");
                        detail.className = "announcement_detail";
                        detail.textContent = item.detail;
                        text.append(detail);

                        const toggle = () => {
                            const open = row.classList.toggle("open");
                            row.setAttribute("aria-expanded", String(open));
                        };

                        row.addEventListener("click", toggle);
                        row.addEventListener("keydown", (e) => {
                            if (e.key === "Enter" || e.key === " ") {
                                e.preventDefault();
                                toggle();
                            }
                        });
                    }

                    row.append(text);
                    aList.append(row);
                }
            }

            // --- se_con / ce_con: event message + date ----------------
            function renderEvents(container, events) {
                if (!events || events.length === 0) {
                    showEmpty(container, "No events");
                    return;
                }

                container.replaceChildren();

                for (const item of events) {
                    const row = document.createElement("div");
                    row.className = "event";

                    const message = document.createElement("p");
                    message.className = "event_message";
                    message.textContent = item.message;

                    const date = document.createElement("p");
                    date.className = "event_date";
                    date.textContent = formatEventDate(item.date);

                    row.append(message, date);
                    container.append(row);
                }
            }

            async function loadBulletin() {
                try {
                    const res = await fetch("/api/bulletin", {
                        credentials: "same-origin",
                        headers: { Accept: "application/json" },
                    });

                    if (!res.ok) throw new Error(`HTTP ${res.status}`);

                    const data = await res.json();
                    const events = data.events || [];

                    renderAnnouncements(data.announcements);
                    renderEvents(
                        seList,
                        events.filter((e) => e.kind === "school"),
                    );
                    renderEvents(
                        ceList,
                        events.filter((e) => e.kind === "club"),
                    );
                } catch (err) {
                    console.error("could not load the bulletin:", err);
                    showEmpty(aList, "Announcements are unavailable right now.");
                    showEmpty(seList, "Events are unavailable right now.");
                    showEmpty(ceList, "Events are unavailable right now.");
                }
            }

            loadBulletin();
        
        
        
            // ============================================================
            //  main.html -- session gate (UX only).
            //
            //  Ask the server who we are. Not logged in -> login page.
            //  This is a convenience, NOT a security boundary: the
            //  browser is untrusted and someone can edit this script.
            //  Real enforcement is requireUser/requireAdmin on the
            //  endpoints that return actual data.
            // ============================================================
            (async () => {
                try {
                    const res = await fetch("/api/me", {
                        credentials: "same-origin",
                        headers: { Accept: "application/json" },
                    });
                    if (!res.ok) {
                        window.location.replace("/static/login/login.html");
                    }
                } catch (err) {
                    console.error("session check failed:", err);
                    window.location.replace("/static/login/login.html");
                }
            })();
        </script>
    
    </body>
</html>
