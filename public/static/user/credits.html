    <script>
        // ============================================================
        //  main.html -- session gate + Account link (UX only).
        //
        //  /api/me reports both who we are and which security mode the
        //  admin switch is on:
        //      strict mode  -> no session means "go log in"; the
        //                      Account / Settings links are shown.
        //      open mode    -> there is no login flow, so the visitor
        //                      stays here and those links are hidden
        //                      (there is nothing to edit without a
        //                      session).
        //
        //  Not a security boundary: /api/bulletin serves the content
        //  and the admin endpoints re-check requireAdmin server-side.
        // ============================================================
        (async () => {
            const accountLink = document.getElementById("account_link");
            const settingsLink = document.getElementById("settings_link");

            try {
                const res = await fetch("/api/me", {
                    credentials: "same-origin",
                    headers: { Accept: "application/json" },
                });

                // In strict mode a logged-out visitor gets 401 -> log in.
                if (res.status === 401) {
                    window.location.replace("/static/login/login.html");
                    return;
                }
                if (!res.ok) return; // server hiccup: keep the page usable

                const me = await res.json();

                if (!me.strict) {
                    if (accountLink) accountLink.hidden = true;
                    if (settingsLink) settingsLink.hidden = true;
                } else if (accountLink) {
                    accountLink.hidden = false;
                }
            } catch (err) {
                console.error("session check failed:", err);
            }
        })();
    </script>
    </body>
