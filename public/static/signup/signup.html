<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isipan ko</title>
</head>
<body>
    <main id="registration_form">
        <h1>Sign Up</h1>
        <form id="form" method="POST" novalidate>
            <label for="name">Name:</label>
            <input
                type="text" name="name"
                placeholder="Last, First, Middle name"
                oninvalid="this.setCustomValidity('Put your last name, first name, and middle initial.')"
                oninput="this.setCustomValidity('')"
                required
            >
            <br>
            <label for="studentId">Student ID:</label>
            <input
                type="text"
                name="studentId"
                placeholder="SJ23-0001"
                pattern="SJ[0-9]{2}-[0-9]{4}"
                oninvalid="this.setCustomValidity('Use the format SJ23-0001')"
                oninput="this.setCustomValidity('')"
                required
            >
            <br>
            <label for="email">Gmail:</label>
            <input
                type="email" name="email"
                placeholder="example@gmail.com"
                pattern="[^\s@]+@gmail\.com"
                required
            >
            <br>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password..."
                minlength="8"
                required
            >
            <p id="message"></p>
            <button type="submit">Submit</button>
        </form>
        <p>Already have an account? <a href="../login/login.html">Log in here</a></p>

    </main>
    <script>
        // Posts to /api/auth/signup as JSON. The password rule below is
        // duplicated on the server in functions/api/auth/signup.js --
        // this copy is only for fast feedback. The server's copy is the
        // one that actually enforces anything.
        const PASSWORD_RULE = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

        document.getElementById("form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const message = document.getElementById("message");
            const button = this.querySelector("button");
            const password = document.getElementById("password").value;

            if (!PASSWORD_RULE.test(password)) {
                message.textContent = "Password must be at least 8 characters, include one uppercase letter, one number, and one special character.";
                message.style.color = "red";
                return;
            }

            button.disabled = true;
            message.textContent = "Creating your account...";
            message.style.color = "inherit";

            try {
                const res = await fetch("/api/auth/signup", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({
                        name: this.name.value,
                        studentId: this.studentId.value,
                        email: this.email.value,
                        password,
                    }),
                });

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    // Show the status code too. A 500 from the Worker
                    // has no JSON body, so without this the real cause
                    // was hidden behind the same generic message as a
                    // 403 (student ID not on the roster).
                    message.textContent =
                        data.error || `Signup failed (HTTP ${res.status}).`;
                    message.style.color = "red";
                    button.disabled = false;
                    console.error("signup failed:", res.status, data);
                    return;
                }

                message.textContent = "Account created! Redirecting...";
                message.style.color = "green";

                // Signup auto-logs-in, so the session cookie is already
                // set. The server tells us where to go next.
                window.location.replace(data.redirect);
            } catch (err) {
                console.error(err);
                message.textContent = "Could not reach the server.";
                message.style.color = "red";
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
