<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WITI Bulletin Board - Admin</title>
    <link rel="stylesheet" href="../../styles/admin_styles.css">
</head>
<body>
    <header>
        <h1 class="main-title">WITI Admin</h1>
        <nav id="navigation">
            <ul>
                <a class="nav_button" href="../user/main.html">Home</a>
                <button class="nav_button" id="logout_button" type="button">Log out</button>
            </ul>
        </nav>
    </header>

    <main>
        <section class="gap"><p>&nbsp;</p></section>

        <section class="card">
            <h2>Add a student to the master list</h2>
            <form id="add_student_form" novalidate>
                <label for="student_id">Student ID:</label>
                <input
                    type="text"
                    id="student_id"
                    name="student_id"
                    placeholder="SJ23-0001"
                    pattern="SJ[0-9]{2}-[0-9]{4}"
                    oninvalid="this.setCustomValidity('Use the format SJ23-0001')"
                    oninput="this.setCustomValidity('')"
                    required
                >
                <br>

                <label for="student_name">Full name:</label>
                <input
                    type="text"
                    id="student_name"
                    name="student_name"
                    placeholder="Juan Dela Cruz"
                    required
                >
                <br>

                <p id="message"></p>
                <button type="submit" id="add_button">Add student</button>
            </form>
        </section>

        <section class="card">
            <h2>Post an announcement</h2>
            <form id="add_announcement_form" novalidate>
                <label for="ann_message">Message:</label>
                <input
                    type="text"
                    id="ann_message"
                    name="ann_message"
                    placeholder="Classes resume on Monday"
                    maxlength="200"
                    required
                >
                <br>

                <label for="ann_detail">Details:</label>
                <textarea
                    id="ann_detail"
                    name="ann_detail"
                    rows="3"
                    maxlength="2000"
                    placeholder="Shown when the message is clicked or hovered (optional)"
                ></textarea>
                <br>

                <p id="ann_message_status"></p>
                <button type="submit" id="add_announcement_button">Post announcement</button>
            </form>
        </section>

        <section class="card">
            <h2>Post an event</h2>
            <form id="add_event_form" novalidate>
                <label for="event_kind">Board:</label>
                <select id="event_kind" name="event_kind">
                    <option value="school">School Events</option>
                    <option value="club">Club Events</option>
                </select>
                <br>

                <label for="event_message">Event:</label>
                <input
                    type="text"
                    id="event_message"
                    name="event_message"
                    placeholder="Foundation Day parade"
                    maxlength="200"
                    required
                >
                <br>

                <label for="event_date">Date:</label>
                <input
                    type="date"
                    id="event_date"
                    name="event_date"
                    required
                >
                <br>

                <p id="event_status"></p>
                <button type="submit" id="add_event_button">Post event</button>
            </form>
        </section>

        <section class="card">
            <h2>Bulletin content</h2>
            <p id="content_status">Loading bulletin&hellip;</p>
            <div id="content_list"></div>
        </section>

        <section class="card">
            <h2>Master list</h2>
            <p id="list_status">Loading roster&hellip;</p>
            <table id="roster_table" hidden>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="roster_body"></tbody>
            </table>
        </section>

        <section>
            <footer>
                <p>Copyright &copy; 2026 WITI Bulletin Board</p>
            </footer>
        </section>
    </main>

    <script>
        // ============================================================
        //  admin.html -- student master-list manager.
        //
        //  Talks to the existing admin endpoint:
        //      GET    /api/admin/students   -> list the roster
        //      POST   /api/admin/students   -> add one student
        //      DELETE /api/admin/students   -> remove one student
        //
        //  The endpoint re-checks "is this an admin?" on every call
        //  (requireAdmin in functions/api/admin/students.js). The guard
        //  below is only for UX -- hiding the page from non-admins.
        //  The browser is untrusted, so it is NOT a security boundary.
        // ============================================================

        const form = document.getElementById("add_student_form");
        const message = document.getElementById("message");
        const addButton = document.getElementById("add_button");
        const listStatus = document.getElementById("list_status");
        const rosterTable = document.getElementById("roster_table");
        const rosterBody = document.getElementById("roster_body");

        // --- 1. Page guard (UX only) --------------------------------
        //  Ask the server who we are. A non-admin gets bounced to the
        //  user page. A determined user could edit this JS and stay on
        //  the page -- but every fetch below still hits requireAdmin,
        //  so they would only see empty/403 responses.
        async function guardAdminPage() {
            try {
                const res = await fetch("/api/me", {
                    credentials: "same-origin",
                    headers: { Accept: "application/json" },
                });
                if (res.status === 401) {
                    window.location.replace("/static/login/login.html");
                    return false;
                }
                if (!res.ok) {
                    window.location.replace("/static/login/login.html");
                    return false;
                }
                const me = await res.json();
                if (me.access !== "admin") {
                    window.location.replace("/static/user/main.html");
                    return false;
                }
                return true;
            } catch (err) {
                console.error("guard failed:", err);
                window.location.replace("/static/login/login.html");
                return false;
            }
        }

        // --- 2. Render the roster -----------------------------------
        function renderRoster(students) {
            rosterBody.replaceChildren();

            if (!students || students.length === 0) {
                rosterTable.hidden = true;
                listStatus.hidden = false;
                listStatus.textContent = "No students on the list yet.";
                return;
            }

            for (const student of students) {
                const row = document.createElement("tr");

                const idCell = document.createElement("td");
                idCell.textContent = student.student_id;

                const nameCell = document.createElement("td");
                nameCell.textContent = student.name;

                const actionCell = document.createElement("td");
                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "remove_button";
                removeButton.textContent = "Remove";
                removeButton.addEventListener("click", () =>
                    removeStudent(student.student_id, removeButton),
                );
                actionCell.append(removeButton);

                row.append(idCell, nameCell, actionCell);
                rosterBody.append(row);
            }

            listStatus.hidden = true;
            rosterTable.hidden = false;
        }

        // --- 2b. Remove a student -----------------------------------
        //  Confirm first (deleting a roster entry is not undoable),
        //  then DELETE the row and refresh the list.
        async function removeStudent(studentId, button) {
            const confirmed = window.confirm(
                `Remove ${studentId} from the master list? This cannot be undone.`,
            );
            if (!confirmed) return;

            button.disabled = true;
            button.textContent = "Removing\u2026";

            try {
                const res = await fetch("/api/admin/students", {
                    method: "DELETE",
                    credentials: "same-origin",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ student_id: studentId }),
                });

                if (res.status === 401 || res.status === 403) {
                    window.location.replace("/static/user/main.html");
                    return;
                }

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    listStatus.hidden = false;
                    listStatus.textContent =
                        data.error || "Could not remove the student.";
                    button.disabled = false;
                    button.textContent = "Remove";
                    return;
                }

                loadRoster();
            } catch (err) {
                console.error(err);
                listStatus.hidden = false;
                listStatus.textContent = "Could not reach the server.";
                button.disabled = false;
                button.textContent = "Remove";
            }
        }

        // textContent (never innerHTML) is used above so a name like
        // "<script>" renders as literal text instead of executing.

        async function loadRoster() {
            listStatus.hidden = false;
            listStatus.textContent = "Loading roster\u2026";
            rosterTable.hidden = true;

            try {
                const res = await fetch("/api/admin/students", {
                    credentials: "same-origin",
                    headers: { Accept: "application/json" },
                });

                if (res.status === 401 || res.status === 403) {
                    window.location.replace("/static/user/main.html");
                    return;
                }

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    listStatus.textContent = data.error || "Could not load the roster.";
                    return;
                }

                renderRoster(data.students);
            } catch (err) {
                console.error(err);
                listStatus.textContent = "Could not reach the server.";
            }
        }

        // --- 3. Add a student ---------------------------------------
        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const studentId = document.getElementById("student_id").value.trim();
            const name = document.getElementById("student_name").value.trim();

            if (!studentId || !name) {
                message.textContent = "Both fields are required.";
                message.style.color = "red";
                return;
            }

            addButton.disabled = true;
            message.textContent = "Adding\u2026";
            message.style.color = "inherit";

            try {
                const res = await fetch("/api/admin/students", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ student_id: studentId, name }),
                });

                if (res.status === 401 || res.status === 403) {
                    window.location.replace("/static/user/main.html");
                    return;
                }

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    message.textContent = data.error || "Could not add the student.";
                    message.style.color = "red";
                    addButton.disabled = false;
                    return;
                }

                message.textContent = `Added ${data.student.student_id}.`;
                message.style.color = "green";
                form.reset();
                addButton.disabled = false;

                // Show the new entry immediately.
                loadRoster();
            } catch (err) {
                console.error(err);
                message.textContent = "Could not reach the server.";
                message.style.color = "red";
                addButton.disabled = false;
            }
        });

        // --- 3b. Bulletin content (announcements + events) ----------
        //  Same endpoint the bulletin page reads:
        //      GET    /api/bulletin   -> { announcements, events }
        //      POST   /api/bulletin   -> add one item
        //      DELETE /api/bulletin   -> remove one item
        const announcementForm = document.getElementById("add_announcement_form");
        const announcementStatus = document.getElementById("ann_message_status");
        const announcementButton = document.getElementById("add_announcement_button");
        const eventForm = document.getElementById("add_event_form");
        const eventStatus = document.getElementById("event_status");
        const eventButton = document.getElementById("add_event_button");
        const contentStatus = document.getElementById("content_status");
        const contentList = document.getElementById("content_list");

        // "July 20, 2020" from "2020-07-20". Parsed as UTC so the
        // displayed day never shifts by one in a negative timezone.
        function formatEventDate(isoDate) {
            const [y, m, d] = String(isoDate).split("-").map(Number);
            const date = new Date(Date.UTC(y, m - 1, d));
            return date.toLocaleDateString("en-US", {
                month: "long",
                day: "numeric",
                year: "numeric",
                timeZone: "UTC",
            });
        }

        function setStatus(el, text, color) {
            el.textContent = text;
            el.style.color = color || "inherit";
        }

        function makeRemoveButton(type, id, label) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "remove_button";
            button.textContent = "Remove";
            button.addEventListener("click", () =>
                removeBulletinItem(type, id, label, button),
            );
            return button;
        }

        function renderContent(data) {
            contentList.replaceChildren();

            const announcements = data.announcements || [];
            const events = data.events || [];

            if (announcements.length === 0 && events.length === 0) {
                contentStatus.hidden = false;
                contentStatus.textContent = "Nothing posted yet.";
                return;
            }
            contentStatus.hidden = true;

            // Announcements
            const annHeading = document.createElement("h3");
            annHeading.textContent = "Announcements";
            contentList.append(annHeading);

            if (announcements.length === 0) {
                const empty = document.createElement("p");
                empty.textContent = "No announcements.";
                contentList.append(empty);
            }

            for (const item of announcements) {
                const row = document.createElement("div");
                row.className = "content_row";

                const text = document.createElement("div");
                const main = document.createElement("p");
                main.className = "content_main";
                main.textContent = item.message;
                text.append(main);

                if (item.detail) {
                    const detail = document.createElement("p");
                    detail.className = "content_detail";
                    detail.textContent = item.detail;
                    text.append(detail);
                }

                row.append(
                    text,
                    makeRemoveButton("announcement", item.id, item.message),
                );
                contentList.append(row);
            }

            // Events
            const eventHeading = document.createElement("h3");
            eventHeading.textContent = "Events";
            contentList.append(eventHeading);

            if (events.length === 0) {
                const empty = document.createElement("p");
                empty.textContent = "No events.";
                contentList.append(empty);
            }

            for (const item of events) {
                const row = document.createElement("div");
                row.className = "content_row";

                const text = document.createElement("div");
                const main = document.createElement("p");
                main.className = "content_main";
                main.textContent = item.message;

                const meta = document.createElement("p");
                meta.className = "content_detail";
                meta.textContent = `${item.kind === "club" ? "Club" : "School"} \u00b7 ${formatEventDate(item.date)}`;

                text.append(main, meta);
                row.append(
                    text,
                    makeRemoveButton("event", item.id, item.message),
                );
                contentList.append(row);
            }
        }

        async function loadContent() {
            contentStatus.hidden = false;
            contentStatus.textContent = "Loading bulletin\u2026";

            try {
                const res = await fetch("/api/bulletin", {
                    credentials: "same-origin",
                    headers: { Accept: "application/json" },
                });
                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    contentStatus.textContent =
                        data.error || "Could not load the bulletin.";
                    return;
                }

                renderContent(data);
            } catch (err) {
                console.error(err);
                contentStatus.textContent = "Could not reach the server.";
            }
        }

        async function removeBulletinItem(type, id, label, button) {
            const confirmed = window.confirm(
                `Remove "${label}" from the bulletin? This cannot be undone.`,
            );
            if (!confirmed) return;

            button.disabled = true;
            button.textContent = "Removing\u2026";

            try {
                const res = await fetch("/api/bulletin", {
                    method: "DELETE",
                    credentials: "same-origin",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ type, id }),
                });

                if (res.status === 401 || res.status === 403) {
                    window.location.replace("/static/user/main.html");
                    return;
                }

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    contentStatus.hidden = false;
                    contentStatus.textContent =
                        data.error || "Could not remove the item.";
                    button.disabled = false;
                    button.textContent = "Remove";
                    return;
                }

                loadContent();
            } catch (err) {
                console.error(err);
                contentStatus.hidden = false;
                contentStatus.textContent = "Could not reach the server.";
                button.disabled = false;
                button.textContent = "Remove";
            }
        }

        announcementForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const messageText = document.getElementById("ann_message").value.trim();
            const detailText = document.getElementById("ann_detail").value.trim();

            if (!messageText) {
                setStatus(announcementStatus, "The message is required.", "red");
                return;
            }

            announcementButton.disabled = true;
            setStatus(announcementStatus, "Posting\u2026");

            try {
                const res = await fetch("/api/bulletin", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({
                        type: "announcement",
                        message: messageText,
                        detail: detailText,
                    }),
                });

                if (res.status === 401 || res.status === 403) {
                    window.location.replace("/static/user/main.html");
                    return;
                }

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    setStatus(
                        announcementStatus,
                        data.error || "Could not post the announcement.",
                        "red",
                    );
                    announcementButton.disabled = false;
                    return;
                }

                setStatus(announcementStatus, "Announcement posted.", "green");
                announcementForm.reset();
                announcementButton.disabled = false;
                loadContent();
            } catch (err) {
                console.error(err);
                setStatus(announcementStatus, "Could not reach the server.", "red");
                announcementButton.disabled = false;
            }
        });

        eventForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const kind = document.getElementById("event_kind").value;
            const messageText = document.getElementById("event_message").value.trim();
            const dateValue = document.getElementById("event_date").value;

            if (!messageText || !dateValue) {
                setStatus(eventStatus, "The event and its date are required.", "red");
                return;
            }

            eventButton.disabled = true;
            setStatus(eventStatus, "Posting\u2026");

            try {
                const res = await fetch("/api/bulletin", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({
                        type: "event",
                        kind,
                        message: messageText,
                        date: dateValue,
                    }),
                });

                if (res.status === 401 || res.status === 403) {
                    window.location.replace("/static/user/main.html");
                    return;
                }

                const data = await res.json().catch(() => ({}));

                if (!res.ok) {
                    setStatus(
                        eventStatus,
                        data.error || "Could not post the event.",
                        "red",
                    );
                    eventButton.disabled = false;
                    return;
                }

                setStatus(eventStatus, "Event posted.", "green");
                eventForm.reset();
                eventButton.disabled = false;
                loadContent();
            } catch (err) {
                console.error(err);
                setStatus(eventStatus, "Could not reach the server.", "red");
                eventButton.disabled = false;
            }
        });

        // --- 4. Logout ----------------------------------------------
        document.getElementById("logout_button").addEventListener("click", async () => {
            try {
                await fetch("/api/auth/logout", {
                    method: "POST",
                    credentials: "same-origin",
                });
            } catch (err) {
                console.error(err);
            }
            window.location.replace("/static/login/login.html");
        });

        // --- 5. Boot ------------------------------------------------
        //  Guard first; only load the roster if we really are an admin.
        (async () => {
            if (await guardAdminPage()) {
                loadRoster();
                loadContent();
            }
        })();
    </script>
</body>
</html>
