<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WITI Bulletin Board - Admin</title>
    <link rel="stylesheet" href="../../styles/admin_styles.css">
</head>
<body>
    <header>
        <h1 class="main-title">WITI Admin</h1>
        <nav id="navigation">
            <ul>
                <a class="nav_button" href="../user/main.html">Home</a>
                <a class="nav_button" href="#" id="logout_button">Log out</a>
            </ul>
        </nav>
    </header>

    <main>
        <section class="gap"><p>&nbsp;</p></section>

        <section class="card">
            <h2>Admin key &ndash; value pairs</h2>
            <p id="cred_who">Checking your session&hellip;</p>

            <form id="add_credential_form" novalidate>
                <label for="cred_name">Name:</label>
                <input
                    type="text"
                    id="cred_name"
                    name="cred_name"
                    placeholder="david"
                    maxlength="32"
                    autocomplete="off"
                    required
                >
                <br>

                <label for="cred_password">Password:</label>
                <input
                    type="password"
                    id="cred_password"
                    name="cred_password"
                    placeholder="Enter a password"
                    autocomplete="new-password"
                    required
                >
                <br>

                <p id="cred_password_count"></p>
                <p id="credential_status"></p>
                <button type="submit" id="add_credential_button">Save key &ndash; value pair</button>
            </form>

            <h3>Saved admins</h3>
            <p id="credential_list_status">Loading admins&hellip;</p>
            <table id="credential_table" hidden>
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Added</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="credential_rows"></tbody>
            </table>
        </section>

        <section class="card">
            <h2>Post an announcement</h2>
            <form id="add_announcement_form" novalidate>
                <label for="ann_message">Message:</label>
                <input
                    type="text"
                    id="ann_message"
                    name="ann_message"
                    placeholder="Classes resume on Monday"
                    maxlength="200"
                    required
                >
                <br>

                <label for="ann_detail">Details:</label>
                <textarea
                    id="ann_detail"
                    name="ann_detail"
                    rows="3"
                    maxlength="2000"
                    placeholder="Shown when the message is clicked or hovered (optional)"
                ></textarea>
                <br>

                <p id="ann_message_status"></p>
                <button type="submit" id="add_announcement_button">Post announcement</button>
            </form>
        </section>

        <section class="card">
            <h2>Post an event</h2>
            <form id="add_event_form" novalidate>
                <label for="event_kind">Board:</label>
                <select id="event_kind" name="event_kind">
                    <option value="school">School Events</option>
                    <option value="club">Club Events</option>
                </select>
                <br>

                <label for="event_message">Event:</label>
                <input
                    type="text"
                    id="event_message"
                    name="event_message"
                    placeholder="Foundation Day parade"
                    maxlength="200"
                    required
                >
                <br>

                <label for="event_date">Date:</label>
                <input
                    type="date"
                    id="event_date"
                    name="event_date"
                    required
                >
                <br>

                <p id="event_status"></p>
                <button type="submit" id="add_event_button">Post event</button>
            </form>
        </section>

        <section class="card">
            <h2>Bulletin content</h2>
            <p id="content_status">Loading bulletin&hellip;</p>
            <div id="content_list"></div>
        </section>

        <section>
            <footer>
                <p>Copyright &copy; 2026 WITI Bulletin Board</p>
            </footer>
        </section>
    </main>

    <script>
        // ============================================================
        //  admin.html -- bulletin manager (no backend).
        //
        //  The server, the login flow and the student master list are
        //  gone, so this page no longer talks to any endpoint. The two
        //  forms and the "Bulletin content" panel stay here as the raw
        //  admin page, and the renderers below keep the exact markup
        //  the page expects.
        //
        //  To wire real data back in, call:
        //      renderContent({ announcements: [...], events: [...] })
        //  and handle each form's submit locally.
        // ============================================================

        const contentStatus = document.getElementById("content_status");
        const contentList = document.getElementById("content_list");

        // "July 20, 2020" from "2020-07-20". Parsed as UTC so the
        // displayed day never shifts by one in a negative timezone.
        function formatEventDate(isoDate) {
            const [y, m, d] = String(isoDate).split("-").map(Number);
            const date = new Date(Date.UTC(y, m - 1, d));
            return date.toLocaleDateString("en-US", {
                month: "long",
                day: "numeric",
                year: "numeric",
                timeZone: "UTC",
            });
        }

        function setStatus(el, text, color) {
            el.textContent = text;
            el.style.color = color || "inherit";
        }

        function renderContent(data) {
            contentList.replaceChildren();

            const announcements = data.announcements || [];
            const events = data.events || [];

            if (announcements.length === 0 && events.length === 0) {
                contentStatus.hidden = false;
                contentStatus.textContent = "Nothing posted yet.";
                return;
            }
            contentStatus.hidden = true;

            // Announcements
            const annHeading = document.createElement("h3");
            annHeading.textContent = "Announcements";
            contentList.append(annHeading);

            if (announcements.length === 0) {
                const empty = document.createElement("p");
                empty.textContent = "No announcements.";
                contentList.append(empty);
            }

            for (const item of announcements) {
                const row = document.createElement("div");
                row.className = "content_row";

                const text = document.createElement("div");
                const main = document.createElement("p");
                main.className = "content_main";
                main.textContent = item.message;
                text.append(main);

                if (item.detail) {
                    const detail = document.createElement("p");
                    detail.className = "content_detail";
                    detail.textContent = item.detail;
                    text.append(detail);
                }

                row.append(text);
                contentList.append(row);
            }

            // Events
            const eventHeading = document.createElement("h3");
            eventHeading.textContent = "Events";
            contentList.append(eventHeading);

            if (events.length === 0) {
                const empty = document.createElement("p");
                empty.textContent = "No events.";
                contentList.append(empty);
            }

            for (const item of events) {
                const row = document.createElement("div");
                row.className = "content_row";

                const text = document.createElement("div");
                const main = document.createElement("p");
                main.className = "content_main";
                main.textContent = item.message;

                const meta = document.createElement("p");
                meta.className = "content_detail";
                meta.textContent = `${item.kind === "club" ? "Club" : "School"} \u00b7 ${formatEventDate(item.date)}`;

                text.append(main, meta);
                row.append(text);
                contentList.append(row);
            }
        }

        // No backend to read from, so start from an empty board.
        renderContent({ announcements: [], events: [] });

        // --- Forms (local only) -------------------------------------
        document.getElementById("add_announcement_form").addEventListener("submit", (e) => {
            e.preventDefault();
            const messageText = document.getElementById("ann_message").value.trim();
            if (!messageText) {
                setStatus(document.getElementById("ann_message_status"), "The message is required.", "red");
                return;
            }
            setStatus(document.getElementById("ann_message_status"), "Announcement saved locally.", "green");
        });

        document.getElementById("add_event_form").addEventListener("submit", (e) => {
            e.preventDefault();
            const messageText = document.getElementById("event_message").value.trim();
            const dateValue = document.getElementById("event_date").value;
            if (!messageText || !dateValue) {
                setStatus(document.getElementById("event_status"), "The event and its date are required.", "red");
                return;
            }
            setStatus(document.getElementById("event_status"), "Event saved locally.", "green");
        });

        // ============================================================
        //  Admin key - value pairs (Cloudflare KV).
        //
        //  Every pair is stored in the WITI_ADMINS namespace through
        //  /api/admin/credentials -- the page never touches KV itself.
        //  Values are shown as names only: the server keeps the
        //  password as a hash and never sends it back.
        //
        //  Passwords have no length limit; they just cannot be empty.
        // ============================================================

        const credWho = document.getElementById("cred_who");
        const credPassword = document.getElementById("cred_password");
        const credPasswordCount = document.getElementById("cred_password_count");
        const credStatus = document.getElementById("credential_status");
        const addCredentialButton = document.getElementById("add_credential_button");
        const credentialRows = document.getElementById("credential_rows");
        const credentialTable = document.getElementById("credential_table");
        const credentialListStatus = document.getElementById("credential_list_status");

        let currentAdmin = null;

        async function api(path, options = {}) {
            const res = await fetch(path, {
                credentials: "same-origin",
                ...options,
                headers: { Accept: "application/json", ...(options.headers || {}) },
            });
            let data = {};
            try {
                data = await res.json();
            } catch {
                // Non-JSON reply (e.g. the site's HTML 404 page).
            }
            return { res, data };
        }

        function formatAdded(value) {
            if (!value) return "\u2014";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return "\u2014";
            return date.toLocaleDateString("en-US", {
                month: "short",
                day: "numeric",
                year: "numeric",
            });
        }

        function renderCredentialList(admins, setupRequired) {
            credentialRows.replaceChildren();
            credentialTable.hidden = admins.length === 0;

            if (admins.length === 0) {
                credentialListStatus.hidden = false;
                credentialListStatus.textContent =
                    "No admins yet. Save the first key - value pair to lock the board down.";
                return;
            }
            credentialListStatus.hidden = true;

            for (const admin of admins) {
                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.textContent = admin.name;
                if (admin.name === currentAdmin) nameCell.textContent += " (you)";

                const dateCell = document.createElement("td");
                dateCell.textContent = formatAdded(admin.createdAt);

                const actionCell = document.createElement("td");
                const removeButton = document.createElement("button");
                removeButton.type = "button";
                removeButton.className = "remove_button";
                removeButton.textContent = "Remove";
                // Keep the last admin in place or the store would go
                // empty and first-run setup would open to everyone.
                removeButton.disabled = !currentAdmin || admins.length <= 1;
                removeButton.addEventListener("click", () => removeCredential(admin.name, removeButton));
                actionCell.append(removeButton);

                row.append(nameCell, dateCell, actionCell);
                credentialRows.append(row);
            }
        }

        async function loadCredentials() {
            credentialListStatus.hidden = false;
            credentialListStatus.textContent = "Loading admins\u2026";
            try {
                const { res, data } = await api("/api/admin/credentials");
                if (!res.ok) {
                    credentialTable.hidden = true;

                    if (res.status === 401) {
                        // The store is not empty and we have no session.
                        credentialListStatus.textContent =
                            "You must log in to manage admins.";
                        setStatus(credStatus, "Not logged in \u2014 heading to the login page\u2026", "red");
                        setTimeout(() => {
                            window.location.replace("./login.html");
                        }, 1500);
                        return;
                    }

                    credentialListStatus.textContent = data.error || "Could not load admins.";
                    return;
                }
                renderCredentialList(data.admins || [], data.setupRequired);
            } catch {
                credentialListStatus.textContent = "Could not reach the server.";
            }
        }

        async function loadSession() {
            try {
                const { res, data } = await api("/api/admin/session");
                currentAdmin = res.ok && data.authenticated ? data.name : null;
            } catch {
                currentAdmin = null;
            }

            if (currentAdmin) {
                credWho.textContent = `Logged in as ${currentAdmin}.`;
            } else {
                credWho.textContent = "Not logged in \u2014 open the admin login page first.";
            }
        }

        async function removeCredential(name, button) {
            if (!window.confirm(`Remove ${name}? They will no longer be able to log in.`)) {
                return;
            }
            button.disabled = true;
            setStatus(credStatus, `Removing ${name}\u2026`);
            try {
                const { res, data } = await api(
                    `/api/admin/credentials/${encodeURIComponent(name)}`,
                    { method: "DELETE" },
                );
                if (!res.ok) {
                    setStatus(credStatus, data.error || "Could not remove that admin.", "red");
                    button.disabled = false;
                    return;
                }
                setStatus(credStatus, data.removed + " removed.", "green");
                await loadCredentials();
            } catch {
                setStatus(credStatus, "Could not reach the server.", "red");
                button.disabled = false;
            }
        }

        credPassword.addEventListener("input", () => {
            // No limit to police, so just show how long it is.
            const count = credPassword.value.length;
            credPasswordCount.textContent = count === 0 ? "" : `${count} characters`;
            credPasswordCount.style.color = "inherit";
        });

        document.getElementById("add_credential_form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const nameInput = document.getElementById("cred_name");
            const name = nameInput.value.trim();
            const password = credPassword.value;

            if (!name) {
                setStatus(credStatus, "Enter a name.", "red");
                nameInput.focus();
                return;
            }
            if (!password) {
                setStatus(credStatus, "Enter a password.", "red");
                credPassword.focus();
                return;
            }

            addCredentialButton.disabled = true;
            setStatus(credStatus, "Saving to Cloudflare KV\u2026");
            try {
                const { res, data } = await api("/api/admin/credentials", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, password }),
                });

                if (!res.ok) {
                    if (res.status === 401) {
                        setStatus(credStatus, "Log in first \u2014 heading to the login page\u2026", "red");
                        setTimeout(() => {
                            window.location.replace("./login.html");
                        }, 1500);
                        return;
                    }
                    setStatus(credStatus, data.error || "Could not save that pair.", "red");
                    return;
                }

                setStatus(credStatus, data.message || "Saved.", "green");
                credPassword.value = "";
                credPasswordCount.textContent = "";
                credPasswordCount.style.color = "inherit";
                nameInput.value = "";
                await loadSession();
                await loadCredentials();
            } catch {
                setStatus(credStatus, "Could not reach the server.", "red");
            } finally {
                addCredentialButton.disabled = false;
            }
        });

        document.getElementById("logout_button").addEventListener("click", async (e) => {
            e.preventDefault();
            try {
                await api("/api/admin/logout", { method: "POST" });
            } catch {
                // Fall through to the login page either way.
            }
            window.location.replace("./login.html");
        });

        (async () => {
            await loadSession();
            await loadCredentials();
        })();
    </script>
</body>
</html>
