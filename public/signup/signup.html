<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isipan ko</title>
</head>
<body>
    <main id="registration_form">
        <h1>Sign Up</h1>
        <form id="form" method="POST">
            <label for="name">Name:</label>
            <input
                type="text" name="name"
                placeholder="Last, First, Middle name"
                oninvalid="this.setCustomValidity('Put your last name, first name, and middle initial.')"
                oninput="this.setCustomValidity('')"
                required
            >
            <br>
            <label for="studentId">Student ID:</label>
            <input
                type="text"
                name="studentId"
                placeholder="SJXX-XXXX..."
                max-length="9"
                required
            >
            <br>
            <label for="email">Gmail:</label>
            <input
                type="email" name="email"
                placeholder="example@gmail.com"
                pattern=".+@gmail\.com"
                required
            >
            <br>
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password..."
                minlength="8"
                required
            >
            <p id="message"></p>
            <button type="submit">Submit</button>
        </form>
        <p>Already have an account?<a href="login.html">click here</a></p>
        
    </main>
    <script>
        document.getElementById("form").addEventListener("submit", function(e) {
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            // Example rule: at least 8 chars, one uppercase, one number, one special char
            const regex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

            if (!regex.test(password)) {
                e.preventDefault(); // stop form submission
                message.textContent = "Password must be at least 8 characters, include one uppercase letter, one number, and one special character.";
                message.style.color = "red";
            } else {
                message.textContent = "Password looks good!";
                message.style.color = "green";
            }
        });
    </script>
</body>
</html>
